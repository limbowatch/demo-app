# Limbowatch end-to-end demo (FINDINGS F-088), on the 0.1.0a4 release.
name: limbowatch
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: limbowatch/limbowatch/integrations/action@v0.1.0a4
        id: limbo
        with:
          fail-on: high
          sarif: limbowatch.sarif
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: limbowatch-report, path: limbowatch-report/ }
      - if: always()
        continue-on-error: true   # code scanning on a private repo needs GitHub Code Security
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: limbowatch.sarif, category: limbowatch }
      - if: always()
        env:
          FINDINGS: ${{ steps.limbo.outputs.findings }}
          FAILING: ${{ steps.limbo.outputs.failing }}
          FAILED: ${{ steps.limbo.outputs.failed }}
        run: echo "outputs - findings=$FINDINGS failing=$FAILING failed=$FAILED"
