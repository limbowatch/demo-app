# Limbowatch end-to-end demo (FINDINGS F-088). Pinned to a commit until 0.1.0 is tagged.
name: limbowatch
on:
  push:
  pull_request:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: limbowatch/limbowatch/integrations/action@c6d16d3243cdd1346e66d64de0cb168a6d58ce9d
        id: limbo
        with:
          fail-on: high
          sarif: limbowatch.sarif
          limbowatch-ref: c6d16d3243cdd1346e66d64de0cb168a6d58ce9d
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: limbowatch-report, path: limbowatch-report/ }
      - if: always()
        continue-on-error: true   # code scanning on a private repo needs GitHub Code Security
        uses: github/codeql-action/upload-sarif@v4
        with: { sarif_file: limbowatch.sarif, category: limbowatch }
      - if: always()
        env:
          FINDINGS: ${{ steps.limbo.outputs.findings }}
          FAILING: ${{ steps.limbo.outputs.failing }}
          FAILED: ${{ steps.limbo.outputs.failed }}
        run: echo "outputs - findings=$FINDINGS failing=$FAILING failed=$FAILED"
